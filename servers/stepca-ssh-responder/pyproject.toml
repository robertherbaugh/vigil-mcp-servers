[project]
name = "vigil-mcp-stepca-responder"
version = "0.1.0"
description = "Reversible response actions over SSH with short-lived step-ca certificates, for Vigil"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["vigil-mcp-common", "httpx>=0.28", "asyncssh>=2.17"]

[project.scripts]
vigil-mcp-stepca-responder = "vigil_mcp_stepca_responder.server:main"

[tool.uv.sources]
vigil-mcp-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil_mcp_stepca_responder"]
