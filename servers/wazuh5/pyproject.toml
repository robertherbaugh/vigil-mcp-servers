[project]
name = "vigil-mcp-wazuh5"
version = "0.1.0"
description = "Read-only MCP tools on Wazuh 5 (findings, events, host state) for Vigil's investigations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["vigil-mcp-common", "httpx>=0.28"]

[project.scripts]
vigil-mcp-wazuh5 = "vigil_mcp_wazuh5.server:main"

[tool.uv.sources]
vigil-mcp-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil_mcp_wazuh5"]
