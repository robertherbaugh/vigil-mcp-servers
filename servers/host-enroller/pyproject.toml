[project]
name = "vigil-host-enroller"
version = "0.1.0"
description = "Enroll Proxmox VMs with step-ca automatically: a VM proves itself through the Proxmox API, gets a one-time host token, and reports its responder kit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "cryptography>=43", "starlette>=0.48", "uvicorn>=0.31"]

[project.scripts]
vigil-host-enroller = "vigil_host_enroller.app:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil_host_enroller"]
