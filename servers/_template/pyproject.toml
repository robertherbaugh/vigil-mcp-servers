[project]
name = "vigil-mcp-template"
version = "0.1.0"
description = "Template MCP server for vigil-mcp-servers: copy this to start a new server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["vigil-mcp-common"]

[project.scripts]
vigil-mcp-template = "vigil_mcp_template.server:main"

[tool.uv.sources]
vigil-mcp-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil_mcp_template"]
