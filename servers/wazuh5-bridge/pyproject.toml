[project]
name = "vigil-wazuh5-bridge"
version = "0.1.1"
description = "Forward Wazuh 5 findings to Vigil, with reviewed, narrow suppressions; nothing is deleted in Wazuh"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pyyaml>=6.0",
  "prometheus-client>=0.21",
]

[project.scripts]
vigil-wazuh5-bridge = "vigil_wazuh5_bridge.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil_wazuh5_bridge"]
