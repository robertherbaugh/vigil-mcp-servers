# Virtual workspace root: no package of its own, only the members and shared dev tooling.
[tool.uv.workspace]
members = ["packages/*", "servers/*"]

[tool.uv.sources]
vigil-mcp-common = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  # Starlette's TestClient needs httpx.
  "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; fixed test tokens are not secrets.
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["packages", "servers"]
addopts = "--import-mode=importlib"
