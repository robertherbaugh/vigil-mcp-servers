name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d   # v10.4.0
        with:
          version: "0.13.10"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  image:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - {server: _template, kind: mcp}
          - {server: wazuh5, kind: mcp}
          - {server: stepca-ssh-responder, kind: mcp}
          - {server: wazuh5-bridge, kind: worker}
    env:
      SERVER: ${{ matrix.server }}
      # One image per job, so a fixed tag. A tag can't start with "_" (_template).
      IMAGE: ci/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Build
        run: docker build -f "servers/$SERVER/Dockerfile" -t "$IMAGE" .
      - name: Smoke test (non-root, read-only, 401 without a token)
        if: matrix.kind == 'mcp'
        run: |
          docker run -d --name smoke --read-only --cap-drop ALL -p 8000:8000 \
            -e MCP_TOKEN="$(openssl rand -base64 32)" -e TARGET_ALLOW=192.0.2.0/24 \
            -e MCP_ALLOWED_HOSTS='127.0.0.1:*' \
            -e WAZUH_INDEXER_URL=https://192.0.2.1:9200 -e WAZUH_INDEXER_USERNAME=ci \
            -e WAZUH_INDEXER_PASSWORD=ci -e STEPCA_URL=https://192.0.2.1 -e STEPCA_FINGERPRINT=00 \
            -e AUTHENTIK_TOKEN_URL=https://192.0.2.1/t -e STEPCA_CLIENT_ID=ci -e SA_USERNAME=sa-ci \
            -e SA_TOKEN=ci "$IMAGE"
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          test "$(docker exec smoke id -u)" = 10001
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = 401
          docker rm -f smoke
      - name: Smoke test (non-root, read-only, validates its example file)
        if: matrix.kind == 'worker'
        run: |
          test "$(docker run --rm --read-only --cap-drop ALL --entrypoint id "$IMAGE" -u)" = 10001
          docker run --rm --read-only --cap-drop ALL \
            -v "$PWD/servers/$SERVER/examples:/examples:ro" "$IMAGE" \
            vigil-wazuh5-bridge validate /examples/suppressions.example.yaml
