# Publishes one server's image when its tag is pushed: <server>/v<version>, for example
# wazuh5-bridge/v0.1.0 -> ghcr.io/<owner>/vigil-wazuh5-bridge:0.1.0. The image is signed keyless
# (Sigstore) by digest. Verify with:
#   cosign verify ghcr.io/<owner>/vigil-wazuh5-bridge@sha256:... \
#     --certificate-identity-regexp '^https://github.com/<owner>/vigil-mcp-servers/\.github/workflows/release\.yml@refs/tags/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing
    steps:
      - name: Server and version from the tag
        id: tag
        env:
          REF: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          server="${REF%%/v*}"; version="${REF##*/v}"
          case "$server" in _*|*[!a-z0-9-]*|"") echo "::error::bad server name '$server'"; exit 1;; esac
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version '$version'"; exit 1; }
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/vigil-$server" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: The tag's version is the package version
        env:
          SERVER: ${{ steps.tag.outputs.server }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: grep -qx "version = \"$VERSION\"" "servers/$SERVER/pyproject.toml"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          file: servers/${{ steps.tag.outputs.server }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab   # v4.1.4
      - name: Sign by digest
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Summary
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          VERSION: ${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published \`$IMAGE:$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
