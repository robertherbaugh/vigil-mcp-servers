[project]
name = "vigil-mcp-common"
version = "0.1.0"
description = "Shared guard rails for vigil-mcp-servers: bearer auth, allowlists, rate limits, audit log, expiring actions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "starlette>=0.48",
  "uvicorn>=0.31",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil_mcp_common"]
